<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ateliê Brasil</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#21a050">
<meta name="mobile-web-app-capable" content="yes">
<style>
@font-face{font-family:"Arcade";src:url(fonts/pressstart.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Baloo";src:url(fonts/baloo700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Baloo";src:url(fonts/baloo800.woff2) format("woff2");font-weight:800;font-display:swap}
:root{--BAR:64px;--ink:#3b1a2e;--wood:#c98a4b;--woodd:#8a5527;--wall:#fff3df}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#ffe9c9;color:var(--ink);font-family:"Baloo",system-ui,sans-serif;font-weight:700}
button{font-family:inherit;font-weight:800;border:0;cursor:pointer;color:inherit;background:none;padding:0}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;overflow:hidden;padding:env(safe-area-inset-top) 0 calc(var(--BAR) + env(safe-area-inset-bottom))}
.screen.on{display:flex}
#wipe{position:fixed;inset:0;z-index:95;display:none;pointer-events:all}
#fx{position:fixed;inset:0;z-index:90;pointer-events:none}
#flash{position:fixed;inset:0;z-index:89;background:#fff;opacity:0;pointer-events:none}
.bar{position:relative;z-index:6;width:100%;display:flex;align-items:center;gap:8px;padding:8px 10px}
.ibtn{min-width:48px;height:48px;border-radius:16px;font-size:24px;line-height:1;background:#fff;display:flex;align-items:center;justify-content:center;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",system-ui;box-shadow:0 4px 0 rgba(90,40,20,.25);padding:0 8px}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(90,40,20,.25)}
.ttl{flex:1;text-align:center;font-family:"Arcade";font-size:11px;line-height:1.5;color:#c41d6e}
.bubble{pointer-events:none;position:fixed;z-index:80;width:240px;background:#fff;border-radius:18px;padding:10px 12px;font-size:18px;text-align:center;box-shadow:0 6px 20px rgba(60,20,40,.3);animation:bIn .35s cubic-bezier(.3,1.7,.5,1)}
.bubble.out{opacity:0;transform:scale(.6);transition:.35s}
@keyframes bIn{from{transform:scale(.3);opacity:0}}
.floaty{position:fixed;z-index:85;pointer-events:none;font-size:26px;transform:translate(-50%,-50%);animation:fly 1.1s ease-out forwards;text-shadow:0 2px 0 #fff}
@keyframes fly{to{margin-top:-80px;opacity:0;scale:1.5}}
.small{font-size:15px;color:#7a5a6a}
.d{display:inline-block;width:20px;height:20px;border-radius:50%;vertical-align:middle;border:2px solid #fff;box-shadow:0 0 0 1px #0002;font-style:normal}
.d.q{background:#eee;text-align:center;line-height:16px;font-size:13px;color:#999}

/* splash */
#splash{padding:0;background:#f7e1c8;justify-content:flex-end}
#cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
#press{position:relative;z-index:2;margin-bottom:calc(var(--BAR) + 40px);font-family:"Arcade";font-size:15px;background:#ff4fa0;color:#fff;padding:18px 22px;border-radius:18px;box-shadow:0 6px 0 #a3125a,0 0 0 6px #fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}

/* museum */
#museum{background:linear-gradient(#fff3df,#ffe1c0)}
#museum .bar{background:#fff7ea;box-shadow:0 4px 0 #f0d3ae}
#mtitle{font-size:12px}
#mcolors{background:#fff;border-radius:14px;padding:6px 10px;font-size:18px;box-shadow:0 3px 0 #0002}
#rooms{flex:1;width:100%;max-width:560px;overflow-y:auto;padding:10px 12px 30px}
.room{background:var(--wall);border-radius:22px;padding:10px 10px 14px;margin-bottom:16px;box-shadow:inset 0 -12px 0 #e8c79a,0 4px 0 #d9b588;border-top:8px solid #b5562c}
.room.locked{filter:grayscale(.85);opacity:.75}
.rhead{display:flex;justify-content:space-between;font-size:19px;color:#7a2e12}
.rsub{font-size:14px;color:#9a6a4a;margin-bottom:6px}
.frames{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.frame{display:flex;flex-direction:column;align-items:center;position:relative}
.frame .pic{position:relative;width:100%;aspect-ratio:1;padding:6px;background:linear-gradient(135deg,#e8b54a,#a8711c);border-radius:6px;box-shadow:0 6px 8px rgba(90,40,10,.35)}
.frame .pic img{width:100%;height:100%;object-fit:cover;display:block;border:2px solid #6b430f;background:#fff}
.frame .pic img.orig{filter:grayscale(1) contrast(.5) brightness(1.35)}
.frame .pic i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;font-style:normal}
.frame.done .pic{background:linear-gradient(135deg,#ffe27a,#d99a00);box-shadow:0 0 0 3px #fff6,0 6px 12px rgba(200,140,0,.5)}
.plate{margin-top:6px;background:#fff;border-radius:8px;padding:2px 5px;font-size:11px;line-height:1.1;text-align:center;box-shadow:0 2px 0 #0002;min-height:28px}
.plate small{display:block;font-size:9.5px;color:#9a6a4a}
.fstars{position:absolute;top:-8px;right:-4px;font-size:16px}
.frame:active .pic{transform:scale(.95)}

/* meet */
#meet{background:radial-gradient(circle at 50% 30%,#fff7e8,#ffd9b0)}
#meetBox{flex:1;width:100%;max-width:480px;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:0 14px 16px;text-align:center}
.painter{width:min(48vw,200px);height:min(48vw,200px);flex-shrink:0}
.painter .pimg,.painter svg{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.painter.jump{animation:enter .9s cubic-bezier(.3,1.6,.5,1)}
@keyframes enter{from{transform:translateX(-120vw) rotate(-30deg)}}
.painter.talk{animation:bob .45s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-6px) rotate(2deg)}}
.pname{font-size:24px;color:#a3125a;line-height:1.1}
.ptitle{font-size:15px;color:#9a6a4a}
.msay{background:#fff;border-radius:18px;padding:10px 14px;font-size:18px;margin:8px 0;min-height:3em;box-shadow:0 4px 0 #0001;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0}
.chip{display:flex;align-items:center;gap:6px;background:#fff;border-radius:14px;padding:4px 8px;font-size:13px;line-height:1.05;text-align:left;box-shadow:0 3px 0 #0002}
.chip>i{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #0003;display:block}
.chip b{font-size:14px;color:#c41d6e}
.chip em{font-style:normal;font-size:10px;display:flex;align-items:center}
.chip em .d{width:14px;height:14px}
.zhword{font-size:18px;margin:6px 0}.zhword b{font-size:26px;color:#c41d6e}
.modes{display:flex;gap:12px;width:100%;margin-top:8px}
.mbtn{flex:1;border-radius:22px;padding:12px 6px;font-size:34px;display:flex;flex-direction:column;align-items:center;color:#fff;line-height:1.1}
.mbtn span{font-size:19px}.mbtn small{font-size:13px;opacity:.9}
.mbtn.exact{background:#2f7dff;box-shadow:0 7px 0 #1d55b8}.mbtn.free{background:#ff4fa0;box-shadow:0 7px 0 #b81a66}
.mbtn:active{transform:translateY(4px)}

/* paint */
#paint{background:#e9dccb}
#paint .bar{padding:6px 8px}
#ptitle{font-size:10px}
#pscore{background:#fff;border-radius:12px;padding:5px 8px;font-size:17px;white-space:nowrap;box-shadow:0 3px 0 #0002}
#pscore small{font-size:12px;color:#999}
#gwrap{width:58px;height:48px;border-radius:10px;overflow:hidden;border:3px solid #fff;box-shadow:0 3px 0 #0003;position:relative;background:#fff}
#gwrap img{width:100%;height:100%;object-fit:cover}#gwrap::after{content:"👀";position:absolute;right:-2px;bottom:-4px;font-size:16px}
#gwrap.blink{animation:blinkg .4s 4}
@keyframes blinkg{50%{box-shadow:0 0 0 6px #ffd23f}}
#paint:not(.exact) #gwrap{opacity:.85}
.progress{width:96%;height:8px;border-radius:5px;background:#fff8;overflow:hidden;flex-shrink:0}
#pfill{height:100%;width:0;background:linear-gradient(90deg,#ff4fa0,#ffd23f,#2fd6a3);transition:width .3s}
#parea{position:relative;flex:1;width:100%;overflow:hidden;touch-action:none;background:repeating-linear-gradient(45deg,#e6d7c3 0 14px,#e1d1bb 14px 28px)}
#pcv,#ov{position:absolute;image-rendering:auto;box-shadow:0 0 0 6px #fff,0 8px 20px rgba(60,30,10,.35);border-radius:2px}
#ov{box-shadow:none;pointer-events:none}

.tools{width:100%;display:flex;align-items:center;gap:8px;padding:6px 8px 2px;flex-shrink:0}
#bwrap{display:flex;align-items:center;gap:6px;background:#fff;border-radius:16px;padding:4px 10px 4px 4px;box-shadow:0 3px 0 #0002;flex:1;min-width:0}
#brushico{position:relative;width:46px;height:46px;flex-shrink:0}
#brushico span{position:absolute;left:4px;top:2px;font-size:38px;transform:rotate(-20deg)}
#btip{position:absolute;left:2px;top:28px;width:20px;height:16px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;border:2px solid #0003;transition:background .3s}
#bname{font-size:12px;line-height:1.05;overflow:hidden}#bname b{color:#c41d6e}
#water{position:relative;width:54px;height:54px;border-radius:12px 12px 22px 22px;background:linear-gradient(#e8f6ff,#bfe5ff);border:3px solid #fff;box-shadow:0 3px 0 #0002;font-size:26px;overflow:hidden}
#water i{position:absolute;inset:0;opacity:0;transition:.5s;mix-blend-mode:multiply}
#water span{position:relative}
.tools .ibtn{min-width:46px;height:50px;font-size:22px}
#pots{width:100%;display:flex;gap:6px;overflow-x:auto;padding:6px 40px 8px;flex-shrink:0;scrollbar-width:none;scroll-padding:0 40px}
.pot{min-width:64px;display:flex;flex-direction:column;align-items:center;font-size:12px;line-height:1.1;font-weight:800}
.pot small{font-size:12px;white-space:nowrap}
.pot i{width:48px;height:48px;border-radius:50%;border:4px solid #fff;box-shadow:0 4px 0 #0003,inset 0 -6px 0 #0002;display:block;margin-bottom:2px}
.pot.want i{box-shadow:0 0 0 3px #ffd23f,0 4px 0 #0003,inset 0 -6px 0 #0002}
.pot:active i{transform:scale(.88)}
#gback{position:fixed;inset:0;z-index:60;display:none}#gback.on{display:block}
#gbig{position:fixed;z-index:61;right:10px;top:70px;width:min(70vw,300px);background:#fff;border-radius:14px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.4);display:none;touch-action:none;animation:bIn .3s}
#gbig.on{display:block}#gbig img{width:100%;display:block;border-radius:8px;pointer-events:none}
#gbig .gh{font-size:13px;text-align:center;color:#999;padding:2px}
#gx{position:absolute;right:-10px;top:-10px;width:40px;height:40px;border-radius:50%;background:#e3262e;color:#fff;font-size:20px;box-shadow:0 3px 0 #0003}
.discover{pointer-events:none;position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:88;background:#fff;border-radius:26px;padding:16px 22px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35);animation:bIn .5s cubic-bezier(.3,1.7,.5,1)}
.discover.out{opacity:0;transition:.4s}
.dmix{display:flex;align-items:center;justify-content:center;gap:8px;font-size:30px}.dmix .d{width:40px;height:40px}
.dmix .big{width:70px;height:70px;border-radius:50%;display:inline-block;border:5px solid #fff;box-shadow:0 0 0 2px #0002;animation:jel .7s}
@keyframes jel{30%{transform:scale(1.25,.8)}60%{transform:scale(.9,1.15)}}
.dname{font-family:"Arcade";font-size:12px;margin-top:8px;color:#a3125a;line-height:1.6}.dname b{font-size:18px}
.dzh{font-size:28px}

/* overlays */
.ov{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(60,20,40,.55);padding-bottom:var(--BAR)}
.ov.on{display:flex}
.obox{background:#fff;border-radius:26px;padding:14px;width:min(92vw,430px);max-height:calc(94vh - var(--BAR));overflow:auto;display:flex;flex-direction:column;gap:10px;text-align:center;animation:bIn .4s cubic-bezier(.3,1.7,.5,1)}
.obox h3{font-family:"Arcade";font-size:14px;margin:4px 0;color:#c41d6e;line-height:1.5}
.orow{font-size:19px;padding:12px;border-radius:16px;background:#fff0f6;box-shadow:0 4px 0 #f3c4d8}
.orow.danger{background:#ffe1e1;color:#b3122a;box-shadow:0 4px 0 #f0b0b0}
.obtns{display:flex;gap:10px}.obtns button{flex:1;font-size:20px;padding:12px;border-radius:16px;color:#fff}
.parent{text-align:left;background:#faf3ff;border-radius:14px;padding:10px}
#mixer .obox{background:linear-gradient(#f3d9b1,#e2b981)}
.palettewood{background:radial-gradient(circle at 30% 30%,#e7b77a,#b77c3e);border-radius:60% 40% 55% 45%/55% 60% 40% 45%;padding:18px 14px;box-shadow:inset 0 -10px 0 #0002,0 6px 0 #7a4a1c}
#mwells{display:flex;align-items:center;justify-content:center;gap:8px;font-size:30px;color:#5a3010}
.well{width:66px;height:66px;border-radius:50%;background:#fff6e8;box-shadow:inset 0 4px 8px #0003;display:flex;align-items:center;justify-content:center;font-size:20px;color:#c9a57a;flex-direction:column;line-height:1}
.well i{width:52px;height:52px;border-radius:50%;display:block;animation:jel .5s}
.well.res{width:84px;height:84px;font-size:30px;color:#fff}
.well.res small{font-size:11px}
.well.swirl{animation:spin .55s linear 2}
.well.ready{box-shadow:0 0 0 5px #ffd23f,0 0 20px #ffd23f;animation:pulse .9s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#mpots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#mbook{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#fff8;border-radius:14px;padding:8px}
.rec{display:flex;align-items:center;gap:3px;font-size:12px;background:#fff;border-radius:10px;padding:3px 5px}.rec span{margin-left:auto}
.rec.no{opacity:.6}.rec.w{box-shadow:0 0 0 2px #ffd23f}
#done .obox{background:linear-gradient(#fff,#fff0f7)}
.dpics{display:flex;gap:8px;align-items:flex-end;justify-content:center}
.dpics figure{margin:0;flex:1;font-size:12px;color:#999}
.dpics img{width:100%;max-height:30vh;object-fit:contain;border:6px solid #e5b04a;border-radius:4px;box-shadow:0 4px 10px #0003;background:#fff}
#dtitle{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px}
#dpainter{width:90px;height:90px;margin:8px auto 0;animation:bob .5s infinite alternate}
#dpainter .crop{width:100%;height:100%;border-width:4px}
#dpainter .pimg,#dpainter svg{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
#dstars{font-size:36px;letter-spacing:4px}
#dmsg{font-size:19px}.newroom{font-family:"Arcade";font-size:12px;color:#2f7dff;margin-top:8px;line-height:1.5}

/* v2: compact meet + done + ceremony */
.mtop{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.mtop .painter{width:110px;height:110px}
.minfo{flex:1}.pname{font-size:21px}.pcountry{font-size:14px;line-height:1.15;margin:2px 0}.pcountry b{font-size:17px;color:#c41d6e}
.msay{font-size:17px;min-height:2.4em;margin:6px 0;padding:8px 12px}
.perfect{background:#fff4c2;border:3px dashed #e0a000;border-radius:16px;padding:8px;font-size:16px;margin-bottom:6px}
.chip{font-size:12px}.chip b{font-size:13px}
.modes{gap:10px;margin-top:6px}
.mbtn{flex-direction:row;justify-content:center;gap:6px;font-size:22px;padding:10px 6px;border-radius:18px}
.mbtn span{font-size:17px}
.donebtn{display:flex;flex-direction:column;align-items:center;justify-content:center;height:50px;padding:0 10px;border-radius:16px;background:#2bc46b;color:#fff;font-size:18px;line-height:1;box-shadow:0 4px 0 #188a49}
.donebtn span{font-size:12px}
.nextbtn{font-size:22px;padding:12px;border-radius:18px;background:#2f7dff;color:#fff;box-shadow:0 6px 0 #1d55b8;line-height:1.1}
.nextbtn small{display:block;font-size:13px;opacity:.9}
#cbox{background:radial-gradient(circle,#fffbe6,#ffe08a)}
.cicon{font-size:110px;line-height:1;animation:jel 1s infinite}
.cname{font-family:"Arcade";font-size:20px;color:#c41d6e}.cpt{font-size:24px}.czh{font-size:18px}.czh b{font-size:26px;color:#c41d6e}
.cfaces{font-size:30px;animation:bob .3s infinite alternate}

.pfloat{position:absolute;right:8px;top:8px;display:flex;gap:6px;z-index:5}
.pfloat .ibtn{min-width:44px;height:44px;font-size:20px}
.pfloat .donebtn{height:44px}
#bwrap{min-width:0}#bname{font-size:22px;line-height:1.1;white-space:nowrap;text-align:left;flex:1}
.potwrap{position:relative;width:100%;flex-shrink:0}
.parr{position:absolute;top:10px;width:32px;height:52px;border-radius:14px;background:#ff4fa0;color:#fff;font-size:16px;z-index:3;box-shadow:0 3px 0 #a3125a;display:none}
.parr.on{display:block}
.parr.l{left:2px;animation:nudgeL 1s ease-in-out infinite}.parr.r{right:2px;animation:nudgeR 1s ease-in-out infinite}
@keyframes nudgeR{50%{transform:translateX(5px)}}@keyframes nudgeL{50%{transform:translateX(-5px)}}

#ploading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:60px;z-index:4;animation:pulse 1s infinite}
#quest{position:relative;margin:6px 8px 0;background:#fff;border-radius:18px;padding:10px;text-align:center;font-size:19px;box-shadow:0 6px 16px #0004;display:none;pointer-events:none}
#quest.on{display:block;animation:bIn .4s cubic-bezier(.3,1.7,.5,1)}
.wordpop{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:87;pointer-events:none;display:flex;align-items:center;gap:12px;background:#fff;border-radius:22px;padding:10px 18px;box-shadow:0 10px 30px #0005;animation:bIn .45s cubic-bezier(.3,1.7,.5,1);font-size:20px;line-height:1.15}
.wordpop .we{font-size:52px}.wordpop .wz{font-size:26px;color:#c41d6e}.wordpop.out{opacity:0;transition:.4s}
#ov{opacity:1}

/* ===================== ATELIÊ BRASIL ===================== */
.sy{font-weight:800}.hif{font-style:normal;color:#bbb;margin:0 1px}
.crop{border-radius:50%;background:#fff;border:4px solid #fff;box-shadow:0 3px 0 #0002;object-fit:cover;display:block;width:80px;height:80px}
/* splash */
#splash{background:#1f7a3a}
#splashArt{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.15)}
#logo{position:relative;z-index:2;margin-top:calc(env(safe-area-inset-top) + 7vh);text-align:center;font-family:"Baloo";font-weight:800;line-height:.9;filter:drop-shadow(0 6px 0 #0004)}
#logo b{display:block;font-size:min(17vw,84px);letter-spacing:2px;-webkit-text-stroke:3px #fff;paint-order:stroke fill}
#logo b span{display:inline-block;animation:bob .6s ease-in-out infinite alternate}
#logo small{display:inline-block;margin-top:6px;font-family:"Arcade";font-size:11px;color:#fff;background:#e3262e;padding:8px 12px;border-radius:12px}
#splash{justify-content:space-between}
#press{background:#ffd23f;color:#3b1a2e;box-shadow:0 6px 0 #b8860b,0 0 0 6px #fff}
#folkday{position:relative;z-index:2;background:#fff;border-radius:18px;padding:8px 14px;font-size:18px;display:none;margin-top:10px}
/* perfis */
#perfis{background:linear-gradient(#9be7ff,#c9f5c4)}
#perfis h2,#nome h2{font-family:"Arcade";font-size:14px;color:#1f5f2f;margin:18px 0 6px;text-align:center;line-height:1.6}
#plist{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(94vw,440px);padding:8px}
.pcard{background:#fff;border-radius:24px;padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;box-shadow:0 6px 0 #0002;gap:4px}
.pcard:active{transform:scale(.95)}
.av{position:relative;width:118px;height:118px;flex-shrink:0}
.av{line-height:0}
.av img{display:block;position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;border:5px solid #ffd23f;background:#fff}
.av .acc{position:absolute;left:50%;top:-16%;transform:translateX(-50%);font-size:.4em;pointer-events:none;line-height:1;width:70%;text-align:center}
.av .acc svg{width:100%;display:block}
.pcard .pn{font-size:22px;color:#c41d6e;letter-spacing:1px}
.pcard .pp{font-size:13px;color:#7a5a6a}
/* teclado do nome */
#nome{background:linear-gradient(#fff3c4,#ffd9e8)}
#nomeIco{font-size:64px;line-height:1;margin:4px 0;animation:bob .6s infinite alternate}
#slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:64px;margin:8px 10px}
.slot{width:44px;height:58px;border-radius:12px;background:#fff;box-shadow:inset 0 -5px 0 #0001,0 3px 0 #0002;font-size:38px;display:flex;align-items:center;justify-content:center;color:#3b1a2e}
.slot.guia{color:#d9c7cf}.slot.cur{box-shadow:0 0 0 4px #2f7dff}.slot.hl{background:#ffd23f;transform:scale(1.15);transition:.15s}
#teclas{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:min(96vw,460px);padding:6px}
.tk{height:52px;border-radius:12px;background:#fff;font-size:26px;box-shadow:0 4px 0 #0002;color:#2560d9}
.tk:nth-child(3n+1){color:#e3262e}.tk:nth-child(3n+2){color:#21a050}
.tk.next{animation:pulse .8s infinite;box-shadow:0 0 0 4px #ffd23f,0 4px 0 #0002}
.tk:active{transform:translateY(3px);box-shadow:none}
.tk.wide{grid-column:span 2;font-size:20px}
#nomeOk{margin-top:8px;font-size:24px;padding:12px 26px;border-radius:18px;background:#21a050;color:#fff;box-shadow:0 6px 0 #146b33}
/* museu = viagem */
#museum{background:linear-gradient(#bff0ff,#e8ffd8)}
#museum .bar{background:#fffbea;box-shadow:0 4px 0 #cfe7b0}
#meAv{width:52px;height:52px}
#meAv .av{width:52px;height:52px}#meAv .av img{border-width:3px}
#mtitle{font-size:10px;color:#1f5f2f}
.room{border-top-color:var(--rc,#b5562c);background:#fffdf3}
.rhead b{display:flex;align-items:center;gap:6px}
.rmap{width:46px;height:48px;flex-shrink:0}
.rsot{font-family:"Arcade";font-size:9px;color:var(--rc);margin-left:4px}
.frame.breve .pic{background:repeating-linear-gradient(45deg,#e7e7e7 0 10px,#f4f4f4 10px 20px)}
.frame.breve .pic i{font-size:30px;flex-direction:column;color:#999}
.frame.breve .pic i small{font-size:10px;font-family:"Baloo"}
.plate{font-size:11.5px}
.mbtns{display:flex;gap:8px;width:100%;max-width:560px;padding:6px 12px 0}
.mbtns button{flex:1;font-size:17px;padding:8px;border-radius:16px;background:#fff;box-shadow:0 4px 0 #0002}
/* chegada: adivinha */
#meet{background:radial-gradient(circle at 50% 30%,#fffbe8,#c9f0c0)}
.adv{background:#fff;border-radius:22px;padding:12px 14px;font-size:19px;margin:10px 0;box-shadow:0 4px 0 #0001;width:100%}
.adv b{display:block;font-family:"Arcade";font-size:11px;color:#c41d6e;margin-bottom:6px;line-height:1.6}
.opts{display:flex;gap:10px;width:100%}
.opt{flex:1;background:#fff;border-radius:20px;padding:10px 4px;box-shadow:0 6px 0 #0002;display:flex;flex-direction:column;align-items:center;font-size:14px;line-height:1.1;gap:4px}
.opt span{font-size:44px}
.opt.no{opacity:.35;animation:shake .4s}.opt.yes{box-shadow:0 0 0 5px #21a050,0 6px 0 #0002;animation:jel .6s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.retrato{width:min(40vw,150px);height:min(40vw,150px);flex-shrink:0;border-width:6px}
.retrato.jump{animation:enter .9s cubic-bezier(.3,1.6,.5,1)}
.retrato.talk{animation:bob .45s ease-in-out infinite alternate}
.mtop .retrato{width:116px;height:116px}
.pmap{display:flex;align-items:center;gap:6px;font-size:14px;line-height:1.1}
.pmap svg{width:64px;height:66px;flex-shrink:0}
.pmap b{font-size:16px;color:#c41d6e}
.lenda{font-size:16px;background:#fff8;border-radius:16px;padding:8px 10px;margin:4px 0;text-align:left}
/* pintar */
#paint{background:#dfe9d3}
.pot.sumiu{opacity:0;transform:scale(0);transition:.4s}
#saci{position:fixed;z-index:65;font-size:54px;width:84px;height:84px;display:none;align-items:center;justify-content:center;filter:drop-shadow(0 4px 4px #0005);transition:left .5s,top .5s}
#saci.on{display:flex;animation:bIn .4s,bob .5s .4s ease-in-out infinite alternate}
#saci .sfala{position:absolute;bottom:88px;left:50%;transform:translateX(-50%);background:#fff;border-radius:14px;padding:5px 8px;font-size:13px;line-height:1.15;text-align:center;white-space:nowrap;box-shadow:0 4px 10px #0004;color:#3b1a2e}
.pot.roubado i{background:#eef3f7;display:flex;align-items:center;justify-content:center;font-size:26px;font-style:normal;animation:spin 1.2s linear infinite;border-style:dashed}
.pot.roubado small{color:#e3262e}
#saci .gorro{position:absolute;top:-6px;left:50%;transform:translateX(-50%) rotate(-10deg);width:56px}
#saci .cara{width:72px;height:72px;border-radius:50%;border:4px solid #fff}
#saci .pote{position:absolute;right:-6px;bottom:-4px;width:30px;height:30px;border-radius:50%;border:3px solid #fff}
#vento{position:fixed;z-index:64;font-size:70px;pointer-events:none;display:none}
#monte{position:relative;margin:6px 8px 0;background:#fff;border-radius:20px;padding:10px;text-align:center;box-shadow:0 6px 16px #0004;display:none}
#monte.on{display:block;animation:bIn .4s cubic-bezier(.3,1.7,.5,1)}
#monte .mw{display:flex;gap:6px;justify-content:center;min-height:52px;margin:6px 0}
#monte .ms{min-width:54px;height:50px;border-radius:12px;font-size:24px;background:#f4f4f4;display:flex;align-items:center;justify-content:center;padding:0 6px}
#monte .tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#monte .tiles button{min-width:64px;height:54px;border-radius:14px;font-size:26px;background:#fff;box-shadow:0 5px 0 #0002;border:3px solid #eee;padding:0 8px}
#monte .tiles button.used{visibility:hidden}
#monte .tiles button.bad{animation:shake .4s}
/* fim */
.parl{background:#fffbe0;border-radius:16px;padding:8px;font-size:17px;line-height:1.25}
.parl div{transition:.2s}.parl div.on{color:#c41d6e;transform:scale(1.06)}
.rima{background:#eef7ff;border-radius:16px;padding:8px}
.rima .q{font-size:18px;cursor:pointer}
.opt .crop{width:84px;height:84px}.rima .opts{margin-top:6px}.rima .opt span{font-size:34px}
.newfig{display:flex;align-items:center;gap:10px;background:#f2fff0;border-radius:16px;padding:6px 10px;text-align:left;font-size:15px}
.newfig .crop{width:64px;height:64px;flex-shrink:0}
/* álbum */
#album .obox{background:linear-gradient(#fff,#f0fff0)}
.figs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fig{display:flex;flex-direction:column;align-items:center;font-size:10.5px;line-height:1.1;gap:3px}
.fig .crop{width:80px;height:80px}
.fig.no .crop{filter:brightness(0) opacity(.25)}
.fig.no b{color:#bbb}
/* guarda-roupa e região */
.wardrobe{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wardrobe button{font-size:34px;width:70px;height:70px;border-radius:18px;background:#fff6dd;box-shadow:0 4px 0 #0002}
.wardrobe button.on{box-shadow:0 0 0 4px #21a050}.wardrobe button.no{filter:grayscale(1);opacity:.35}
#regBox .bigmap svg{width:min(70vw,280px);height:auto}
#regBox .rn{font-family:"Arcade";font-size:18px;line-height:1.5}
#regBox .sot{font-size:34px;font-weight:800;color:#e3262e;animation:jel 1s infinite}
.bigmap path,.rmap path,.pmap path{stroke:#fff;stroke-width:1.2}
/* 🔈 ouvir de novo */
.rep{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 2px 0 #0002,0 0 0 2px #ffd23f;font-size:17px;vertical-align:middle;margin-left:4px;flex-shrink:0;line-height:1;padding:0;font-family:system-ui}
.rep:active{transform:scale(.9)}
.rep svg{display:block}
#semvoz{position:fixed;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));z-index:90;background:#fff8e0;border:3px solid #ffd23f;border-radius:16px;padding:10px 44px 10px 12px;font:600 15px/1.3 'Baloo 2',system-ui;color:#3a2410;box-shadow:0 6px 18px #0004}
#semvoz svg{display:inline-block;vertical-align:middle}
#semvoz button{position:absolute;right:6px;top:6px;width:32px;height:32px;border-radius:50%;background:#ffd23f;font-size:15px;display:flex;align-items:center;justify-content:center}
.msay{display:flex;align-items:center;gap:6px;justify-content:center}
.newfig .rep{margin-left:auto}
.parl{position:relative}.parl .rep{display:flex;margin:6px auto 0}
.rhead b{flex-wrap:wrap}
.wordpop{max-width:92vw}
.room.esp{border-top-color:#c41d6e;background:linear-gradient(#fff6fb,#fffdf3)}
.frame.fechada .pic{filter:grayscale(.9) brightness(.9)}
/* barra da pintura: nada fica em cima do desenho */
.pbar{gap:6px;padding:6px}
.pbar .sp{flex:1}
.pbar .ibtn{min-width:44px;height:46px;font-size:21px;padding:0 6px}
.pbar #gwrap{width:52px;height:46px}
.pbar .donebtn{height:46px;padding:0 10px;font-size:17px;flex-direction:row;gap:5px}
.donebtn i{font-style:normal;line-height:1;display:block}
.pbar .donebtn span{font-size:11px}
#missao{width:100%;flex-shrink:0}
#paint.missao .tools,#paint.missao .potwrap{display:none}
#quest,#monte{font-size:20px}
/* nova pintora e escolha do retrato */
.pcard.novo{background:#fffbe0;border:4px dashed #21a050;justify-content:center;min-height:200px}
.pcard.novo .mais{font-size:80px;line-height:1;color:#21a050}
#avatar{background:linear-gradient(#ffe0f0,#d9f2ff)}
#avNome{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:4px 8px}
#avNome .slot{width:38px;height:50px;font-size:32px}
#avGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(94vw,420px);padding:8px;overflow-y:auto}
.avpick{background:#fff;border-radius:22px;padding:8px;box-shadow:0 5px 0 #0002;display:flex;align-items:center;justify-content:center;aspect-ratio:1}
.avpick .av{width:88%!important;height:88%!important}
.avpick.sel{box-shadow:0 0 0 5px #21a050,0 5px 0 #0002;animation:jel .5s}
#avOk{margin-top:8px;font-size:24px;padding:12px 26px;border-radius:18px;background:#21a050;color:#fff;box-shadow:0 6px 0 #146b33}
#avOk:disabled{opacity:.4}
/* janela com moldura e barra de rolagem */
.obox.swin{flex-direction:row;padding:0;gap:0;overflow:hidden;border:6px solid #2560d9;position:relative;box-shadow:0 0 0 3px #fff,0 12px 30px #0006}
.sbody{flex:1;min-width:0;overflow-y:auto;padding:14px 10px 14px 14px;display:flex;flex-direction:column;gap:10px;text-align:center;scrollbar-width:none}
.sbody::-webkit-scrollbar{display:none}
.sbar{width:34px;flex-shrink:0;display:flex;flex-direction:column;background:#e3e9f5;border-left:3px solid #2560d9}
.sbar button{height:40px;flex-shrink:0;background:linear-gradient(#f4f7fd,#c3cfe8);color:#2560d9;font-size:16px;border-bottom:2px solid #9fb0d0}
.sbar button.sdn{border-top:2px solid #9fb0d0;border-bottom:0}
.sbar button:active{background:#9fb0d0}
.strack{flex:1;position:relative;touch-action:none}
.sthumb{position:absolute;left:4px;right:4px;border-radius:10px;background:linear-gradient(90deg,#4f86ef,#2560d9);box-shadow:inset 0 0 0 2px #fff6}
.smore{position:absolute;left:12px;right:46px;bottom:10px;display:none;background:#ffd23f;color:#3b1a2e;border-radius:16px;padding:8px;font-size:15px;box-shadow:0 4px 0 #b8860b,0 0 0 3px #fff;animation:nudgeD .9s ease-in-out infinite}
.swin.mais .smore{display:block}
@keyframes nudgeD{50%{transform:translateY(5px)}}
/* a fonte arcade desenha É/Ê/Ã pequenininhos: em texto com acento usamos a Baloo (letra bastão clara para quem está aprendendo a ler) */
.ttl,.adv b,.rsot,#regBox .rn,.obox h3,#perfis h2,#nome h2,.dname,.newroom,.cname{font-family:"Baloo";font-weight:800;letter-spacing:.5px}
.ttl{font-size:17px!important;line-height:1.05}.adv b{font-size:20px}.rsot{font-size:13px}#regBox .rn{font-size:30px}.obox h3{font-size:22px}#perfis h2,#nome h2{font-size:26px}.dname{font-size:20px}.newroom{font-size:18px}.cname{font-size:30px}
</style>
</head>
<body>
<section id="splash" class="screen on"><img id="splashArt" alt=""><div id="logo"><b><span style="color:#21a050">A</span><span style="color:#ffd23f">T</span><span style="color:#2560d9">E</span><span style="color:#e3262e">L</span><span style="color:#ff8a1f">I</span><span style="color:#8a3fc4">Ê</span><br><span style="color:#2560d9">B</span><span style="color:#21a050">R</span><span style="color:#ffd23f">A</span><span style="color:#e3262e">S</span><span style="color:#ff8a1f">I</span><span style="color:#21a050">L</span></b><small>PINTE O FOLCLORE!</small><div id="folkday">🎉 HOJE É O DIA DO FOLCLORE! 🎉</div></div><button id="press">TOQUE PARA PINTAR!</button></section>

<section id="perfis" class="screen"><h2>QUEM VAI PINTAR?</h2><div id="plist"></div></section>

<section id="nome" class="screen"><h2>ESCREVA O SEU NOME!</h2><div id="nomeIco">✏️</div><div id="slots"></div><div id="teclas"></div><button id="nomeOk">✅ PRONTO!</button></section>

<section id="avatar" class="screen"><h2>ESCOLHA O SEU RETRATO!</h2><div id="avNome"></div><div id="avGrid"></div><button id="avOk">✅ ESSA SOU EU!</button></section>

<section id="museum" class="screen">
  <div class="bar"><button class="ibtn" id="gear">⚙️</button><button id="meAv"></button><div class="ttl" id="mtitle"></div><div id="mcolors"></div></div>
  <div class="mbtns"><button id="bAlbum">📒 FIGURINHAS</button><button id="bRoupa">👒 FANTASIAS</button></div>
  <div id="rooms"></div>
</section>

<section id="meet" class="screen">
  <div class="bar"><button class="ibtn" id="mback">🗺️</button><div class="ttl" id="meetTtl"></div></div>
  <div id="meetBox"></div>
</section>

<section id="paint" class="screen">
  <div class="bar pbar"><button class="ibtn" id="pback">🗺️</button><div id="pscore"></div><span class="sp"></span><button class="ibtn" id="helpBtn">💡</button><button class="ibtn" id="zin">🔍</button><button id="gwrap"><img id="gthumb" alt=""></button><button class="donebtn" id="finishBtn"><i>✅</i><span>PRONTO</span></button><div id="ptitle" hidden></div></div>
  <div class="progress"><div id="pfill"></div></div>
  <div id="parea"><canvas id="pcv"></canvas><canvas id="ov"></canvas><div id="ploading">🎨</div></div>
  <div id="missao"><div id="quest"></div><div id="monte"></div></div>
  <div class="tools">
    <button id="bwrap"><div id="brushico"><div id="btip"></div><span>🖌️</span></div><div id="bname"></div></button>
    <button id="water"><i></i><span>💧</span></button>
    <button class="ibtn" id="mixbtn">🥣</button><button class="ibtn" id="undo">↩️</button>
  </div>
  <div class="potwrap"><button class="parr l" id="parrL">◀</button><div id="pots"></div><button class="parr r" id="parrR">▶</button></div>
</section>
<div id="gback"></div>
<div id="gbig"><button id="gx">✕</button><img alt=""><div class="gh">✋ arraste · toque fora para fechar</div></div>
<div id="saci"></div><div id="vento">🌪️</div>

<div class="ov" id="mixer"><div class="obox"><h3>🥣 MESA DE MISTURAR</h3>
  <div class="palettewood"><div id="mwells"></div></div><div class="small">Toque em duas cores para misturar!</div><div id="mpots"></div>
  <h3 style="font-size:11px">📖 MEU LIVRO DE RECEITAS</h3><div id="mbook"></div><button class="orow" id="mclose">✖ FECHAR</button></div></div>

<div class="ov" id="done"><div class="obox"><h3 id="dtitle"></h3><div id="dpainter"></div>
  <div class="dpics"><figure><img id="dmine" alt=""><figcaption>a minha 💖</figcaption></figure><figure><img id="dorig" alt=""><figcaption>a original</figcaption></figure></div>
  <div id="dstars"></div><div id="dmsg"></div><div id="dfig"></div><div id="dparl"></div><div id="drima"></div>
  <button class="nextbtn" id="dnext"></button>
  <div class="obtns"><button id="dmuseum" style="background:#21a050;font-size:26px">🗺️</button><button id="dsave" style="background:#2f7dff;font-size:26px">💾</button></div></div></div>
<div class="ov" id="ceremony"><div class="obox" id="cbox"></div></div>
<div class="ov" id="regiao"><div class="obox" id="regBox"></div></div>
<div class="ov" id="album"><div class="obox" id="albBox"></div></div>
<div class="ov" id="roupa"><div class="obox" id="roupaBox"></div></div>
<div class="ov" id="opts"><div class="obox" id="obox"></div></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<div id="wipe"></div><div id="flash"></div><canvas id="fx"></canvas>

<script src="js/paginas.js"></script>
<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/mapa.js"></script>
<script src="js/lendas.js"></script>
<script src="js/music.js"></script>
<script src="js/app.js"></script>
</body>
