<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>中文 · Mandarim para Viagem</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#a6372f">
<style>
  :root{
    --bg:#f5f4f2;
    --card:#ffffff;
    --ink:#2b2b2b;
    --ink-soft:#6b6b6b;
    --line:#e3e1dd;
    --accent:#a6372f;
    --accent-ink:#ffffff;
    --good:#3f7a4f;
    --bad:#b0473d;
    --locked:#b8b5af;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    padding:20px 18px 40px;
    display:flex;
    flex-direction:column;
  }
  h1{
    font-size:1.4rem;
    margin:0 0 4px;
    text-align:center;
  }
  .subtitle{
    text-align:center;
    color:var(--ink-soft);
    font-size:0.95rem;
    margin-bottom:20px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px;
    margin-bottom:16px;
  }
  .btn{
    display:block;
    width:100%;
    padding:16px 14px;
    margin:8px 0;
    font-size:1.05rem;
    font-weight:600;
    border-radius:14px;
    border:none;
    cursor:pointer;
    text-align:center;
    -webkit-tap-highlight-color:transparent;
  }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-secondary{ background:#eceae6; color:var(--ink); }
  .btn-good{ background:var(--good); color:#fff; }
  .btn-bad{ background:var(--bad); color:#fff; }
  .btn-small{
    padding:10px 12px;
    font-size:0.9rem;
    width:auto;
    display:inline-block;
    margin:4px 6px 4px 0;
    background:#eceae6;
    color:var(--ink);
    border-radius:10px;
  }
  .btn[disabled]{ opacity:0.45; cursor:default; }
  .row{ display:flex; gap:8px; }
  .row .btn{ flex:1; }

  .hanzi{
    font-size:3.2rem;
    text-align:center;
    margin:6px 0 2px;
    line-height:1.2;
  }
  .pinyin{
    font-size:1.3rem;
    text-align:center;
    color:var(--ink-soft);
    margin-bottom:14px;
  }
  .translation{
    font-size:1.3rem;
    text-align:center;
    margin:14px 0;
    padding:14px;
    background:#f0efec;
    border-radius:12px;
  }
  .response-block{
    border-top:1px dashed var(--line);
    margin-top:14px;
    padding-top:14px;
  }
  .response-block .hanzi{ font-size:2rem; }
  .response-block .pinyin{ font-size:1.05rem; margin-bottom:8px;}
  .label{
    font-size:0.8rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-soft);
    margin-bottom:6px;
    text-align:center;
  }

  .group-list{ list-style:none; padding:0; margin:0; }
  .group-list li{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:0.98rem;
  }
  .group-list li:last-child{ border-bottom:none; }
  .badge{
    font-size:0.82rem;
    padding:4px 10px;
    border-radius:999px;
    background:#eceae6;
    color:var(--ink-soft);
  }
  .badge.done{ background:var(--good); color:#fff; }
  .badge.locked{ background:var(--locked); color:#fff; }

  .status-big{
    text-align:center;
    font-size:1.15rem;
    margin-bottom:6px;
  }
  .status-sub{
    text-align:center;
    color:var(--ink-soft);
    font-size:0.9rem;
    margin-bottom:16px;
  }
  .hidden{ display:none !important; }
  .center{ text-align:center; }
  .muted{ color:var(--ink-soft); font-size:0.85rem; }
  footer{
    margin-top:auto;
    padding-top:24px;
    text-align:center;
  }
  .dialogue-choice{
    display:block;
    width:100%;
    text-align:left;
    padding:16px;
    margin:8px 0;
    border-radius:14px;
    border:1px solid var(--line);
    background:var(--card);
    font-size:1rem;
  }
  .dialogue-choice[disabled]{ opacity:0.4; }
  .progress-dots{
    text-align:center;
    color:var(--ink-soft);
    font-size:0.9rem;
    margin-bottom:8px;
  }
  .history-summary{
    text-align:center;
    margin-bottom:6px;
  }
  .history-day{ margin-bottom:18px; }
  .history-day-title{
    font-size:0.95rem;
    font-weight:600;
    margin-bottom:8px;
  }
  .history-entry{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
  }
  .history-entry:last-child{ border-bottom:none; }
  .history-time{
    color:var(--ink-soft);
    font-size:0.8rem;
    width:42px;
    flex-shrink:0;
  }
  .history-text{ flex:1; }
  .history-text .hz{ font-size:1.1rem; }
  .history-text .tr{ font-size:0.85rem; color:var(--ink-soft); }
  .history-mark{
    font-size:1.1rem;
    width:24px;
    text-align:center;
    flex-shrink:0;
  }
  .history-mark.ok{ color:var(--good); }
  .history-mark.no{ color:var(--bad); }

  .word-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin:10px 0 14px;
  }
  .word-chip{
    background:#f0efec;
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px 10px;
    min-width:44px;
    text-align:center;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .word-chip .word-hz{ font-size:1.4rem; }
  .word-chip .word-py{ font-size:0.72rem; color:var(--ink-soft); }
  .counters{
    text-align:center;
    font-size:0.85rem;
    color:var(--ink-soft);
    margin-top:10px;
  }
  .mic-result{
    text-align:center;
    font-size:0.85rem;
    margin-top:4px;
    min-height:1.2em;
  }
</style>
</head>
<body>
<div id="app">
  <h1>中文 · Viagem à China</h1>
  <div class="subtitle">Estudo com repetição espaçada</div>

  <!-- HOME -->
  <div id="view-home">
    <div class="card">
      <div class="status-big" id="home-status">—</div>
      <div class="status-sub" id="home-sub"></div>
      <button class="btn btn-primary" id="btn-start-study">Continuar estudo</button>
      <button class="btn btn-secondary" id="btn-start-dialogue">Modo diálogo</button>
      <button class="btn btn-secondary" id="btn-start-history">Histórico</button>
    </div>

    <div class="card">
      <div class="label">Progresso por grupo</div>
      <ul class="group-list" id="group-list"></ul>
    </div>

    <footer>
      <button class="btn-small" id="btn-reset">Reiniciar progresso (teste)</button>
    </footer>
  </div>

  <!-- STUDY -->
  <div id="view-study" class="hidden">
    <div class="progress-dots" id="study-progress"></div>
    <div class="card" id="study-card"></div>
    <button class="btn btn-secondary" id="btn-study-back">Voltar ao início</button>
  </div>

  <!-- DIALOGUE PICK -->
  <div id="view-dialogue-pick" class="hidden">
    <div class="card">
      <div class="label">Escolha um diálogo</div>
      <div id="dialogue-list"></div>
    </div>
    <button class="btn btn-secondary" id="btn-dialogue-back">Voltar ao início</button>
  </div>

  <!-- DIALOGUE PLAY -->
  <div id="view-dialogue-play" class="hidden">
    <div class="progress-dots" id="dialogue-progress"></div>
    <div class="card" id="dialogue-card"></div>
    <div class="row">
      <button class="btn btn-secondary" id="btn-dialogue-stop">Parar</button>
    </div>
  </div>

  <!-- HISTORY -->
  <div id="view-history" class="hidden">
    <div class="card">
      <div class="history-summary" id="history-summary"></div>
    </div>
    <div id="history-list"></div>
    <button class="btn btn-secondary" id="btn-history-back">Voltar ao início</button>
  </div>
</div>

      words:[W("可","kě"),W("以","yǐ"),W("便","pián"),W("宜","yi"),W("一","yì"),W("点","diǎn"),W("吗","ma")], responses:[]},

    {id:21, group:5, hanzi:"你会说中文吗?", pinyin:"nǐ huì shuō zhōngwén ma?", pt:"você fala chinês?",
      words:[W("你","nǐ"),W("会","huì"),W("说","shuō"),W("中","zhōng"),W("文","wén"),W("吗","ma")], responses:[
      {hanzi:"我只会一点点", pinyin:"wǒ zhǐ huì yìdiǎndiǎn", pt:"só sei um pouquinho", words:[W("我","wǒ"),W("只","zhǐ"),W("会","huì"),W("一","yì"),W("点","diǎn"),W("点","diǎn")]},
      {hanzi:"我刚开始学", pinyin:"wǒ gāng kāishǐ xué", pt:"acabei de começar a aprender", words:[W("我","wǒ"),W("刚","gāng"),W("开","kāi"),W("始","shǐ"),W("学","xué")]}
    ]},
    {id:22, group:5, hanzi:"你的中文说得很好!", pinyin:"nǐ de zhōngwén shuō de hěn hǎo!", pt:"seu chinês está muito bom!",
      words:[W("你","nǐ"),W("的","de"),W("中","zhōng"),W("文","wén"),W("说","shuō"),W("得","de"),W("很","hěn"),W("好","hǎo")], responses:[
      {hanzi:"哪里哪里", pinyin:"nǎlǐ nǎlǐ", pt:"imagina, não é bem assim", words:[W("哪","nǎ"),W("里","lǐ"),W("哪","nǎ"),W("里","lǐ")]},
      {hanzi:"谢谢,我还在学", pinyin:"xièxie, wǒ hái zài xué", pt:"obrigado, ainda estou aprendendo", words:[W("谢","xiè"),W("谢","xie"),W("我","wǒ"),W("还","hái"),W("在","zài"),W("学","xué")]}
    ]},
    {id:23, group:5, hanzi:"我只会一点点", pinyin:"wǒ zhǐ huì yìdiǎndiǎn", pt:"só sei um pouquinho",
      words:[W("我","wǒ"),W("只","zhǐ"),W("会","huì"),W("一","yì"),W("点","diǎn"),W("点","diǎn")], responses:[]},
    {id:24, group:5, hanzi:"我很喜欢中文", pinyin:"wǒ hěn xǐhuan zhōngwén", pt:"gosto muito de chinês",
      words:[W("我","wǒ"),W("很","hěn"),W("喜","xǐ"),W("欢","huan"),W("中","zhōng"),W("文","wén")], responses:[]},
    {id:25, group:5, hanzi:"我想学更多", pinyin:"wǒ xiǎng xué gèng duō", pt:"quero aprender mais",
      words:[W("我","wǒ"),W("想","xiǎng"),W("学","xué"),W("更","gèng"),W("多","duō")], responses:[]}
  ];

  var MAX_GROUP = 5;

  var GROUP_NAMES = {
    1:"Introdução / cumprimento",
    2:"Cortesia",
    3:"Sobre você",
    4:"Localização / ajuda",
    5:"Sobre seu mandarim"
  };

  var DIALOGUES = [
    {group:1, title:"Cumprimentar alguém", ids:[1,2,3,4,5]},
    {group:2, title:"Pedir desculpa e agradecer", ids:[8,9,6,7]},
    {group:3, title:"Se apresentar e negociar preço", ids:[11,10,13,14,15]},
    {group:4, title:"Pedir ajuda e localização", ids:[17,18,19,20]},
    {group:5, title:"Explicar que está aprendendo", ids:[21,23,22,24,25]}
  ];

  var INTERVALS = [1,3,7]; // dias após 1a, 2a, 3a acerto (dias diferentes)
  var STORAGE_KEY = "mandarim-china-app-v1";

  /* ---------- Estado ---------- */
  var state = loadState();

  var MAX_LOG_ENTRIES = 1000;

  function defaultState(){
    return { unlockedGroup:1, srs:{}, log:[], counters:{} };
  }
  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if(!parsed.srs) parsed.srs = {};
      if(!parsed.unlockedGroup) parsed.unlockedGroup = 1;
      if(!parsed.log) parsed.log = [];
      if(!parsed.counters) parsed.counters = {};
      return parsed;
    }catch(e){
      return defaultState();
    }
  }
  function getCounters(key){
    if(!state.counters[key]) state.counters[key] = { heard:0, spoken:0 };
    return state.counters[key];
  }
  function saveState(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }
  function getSRS(id){
    if(!state.srs[id]){
      state.srs[id] = { correctCount:0, lastCorrectDate:null, nextReview: todayStr(), learned:false };
    }
    return state.srs[id];
  }

  /* ---------- Datas ---------- */
  function todayStr(){
    var d = new Date();
    return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  }
  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function addDays(dateStr, n){
    var parts = dateStr.split("-").map(Number);
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    d.setDate(d.getDate()+n);
    return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  }

  /* ---------- TTS ---------- */
  var chineseVoice = null;
  function loadVoices(){
    var voices = speechSynthesis.getVoices();
    chineseVoice = voices.find(function(v){ return v.lang === "zh-CN"; })
      || voices.find(function(v){ return v.lang && v.lang.indexOf("zh") === 0; })
      || null;
  }
  if("speechSynthesis" in window){
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
  }
  function speak(text, rate, onEnd){
    if(!("speechSynthesis" in window)){
      if(onEnd) onEnd();
      return;
    }
    speechSynthesis.cancel();
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = "zh-CN";
    if(chineseVoice) utter.voice = chineseVoice;
    utter.rate = rate || 1;
    if(onEnd) utter.onend = onEnd;
    speechSynthesis.speak(utter);
  }
  function hear(key, text, rate, onEnd){
    getCounters(key).heard++;
    saveState();
    speak(text, rate, onEnd);
  }

  /* ---------- Reconhecimento de voz (contador "falei") ---------- */
  var SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recognitionSupported = !!SpeechRecognitionCtor;
  var activeRecognition = null;

  function startListening(key, buttonEl, resultEl, onSpoken){
    if(!recognitionSupported){
      resultEl.textContent = "Reconhecimento de voz não é suportado neste navegador.";
      return;
    }
    if(activeRecognition){
      try{ activeRecognition.stop(); }catch(e){}
    }
    var rec = new SpeechRecognitionCtor();
    activeRecognition = rec;
    rec.lang = "zh-CN";
    rec.interimResults = false;
    rec.maxAlternatives = 1;

    var originalLabel = buttonEl.textContent;
    buttonEl.textContent = "🎤 Ouvindo...";
    buttonEl.disabled = true;
    resultEl.textContent = "";

    rec.onresult = function(event){
      var said = event.results[0][0].transcript;
      getCounters(key).spoken++;
      saveState();
      resultEl.textContent = "Você disse: " + said;
      if(onSpoken) onSpoken();
    };
    rec.onerror = function(event){
      resultEl.textContent = (event.error === "not-allowed")
        ? "Permissão de microfone negada."
        : "Não consegui te ouvir, tenta de novo.";
    };
    rec.onend = function(){
      buttonEl.textContent = originalLabel;
      buttonEl.disabled = false;
      activeRecognition = null;
    };
    try{
      rec.start();
    }catch(e){
      buttonEl.textContent = originalLabel;
      buttonEl.disabled = false;
      resultEl.textContent = "Não foi possível iniciar o microfone.";
    }
  }

  /* ---------- Palavras clicáveis + controles de prática ---------- */
  function renderWordChips(container, words){
    if(!words || !words.length) return;
    var row = document.createElement("div");
    row.className = "word-row";
    words.forEach(function(w){
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "word-chip";
      var hz = document.createElement("div");
      hz.className = "word-hz";
      hz.textContent = w.hanzi;
      var py = document.createElement("div");
      py.className = "word-py";
      py.textContent = w.pinyin;
      chip.appendChild(hz);
      chip.appendChild(py);
      chip.onclick = function(){ speak(w.hanzi, 1); };
      row.appendChild(chip);
    });
    container.appendChild(row);
  }

  function buildAudioBlock(key, hanziText, words){
    var wrap = document.createElement("div");

    renderWordChips(wrap, words);

    var row1 = document.createElement("div");
    row1.className = "row";
    var btnNormal = document.createElement("button");
    btnNormal.className = "btn btn-secondary";
    btnNormal.textContent = "Ouvir";
    var btnSlow = document.createElement("button");
    btnSlow.className = "btn btn-secondary";
    btnSlow.textContent = "Devagar";
    row1.appendChild(btnNormal);
    row1.appendChild(btnSlow);
    wrap.appendChild(row1);

    var row2 = document.createElement("div");
    row2.className = "row";
    var btnMic = document.createElement("button");
    btnMic.className = "btn btn-secondary";
    btnMic.textContent = "🎤 Falar";
    btnMic.disabled = !recognitionSupported;
    row2.appendChild(btnMic);
    wrap.appendChild(row2);

    var counters = document.createElement("div");
    counters.className = "counters";
    wrap.appendChild(counters);

    var micResult = document.createElement("div");
    micResult.className = "mic-result muted";
    wrap.appendChild(micResult);

    function refreshCounters(){
      var c = getCounters(key);
      counters.textContent = "🔊 ouvida " + c.heard + "x · 🎤 falada " + c.spoken + "x";
    }
    refreshCounters();

    btnNormal.onclick = function(){ hear(key, hanziText, 1); refreshCounters(); };
    btnSlow.onclick = function(){ hear(key, hanziText, 0.6); refreshCounters(); };
    btnMic.onclick = function(){ startListening(key, btnMic, micResult, refreshCounters); };

    return { wrap: wrap, refreshCounters: refreshCounters };
  }

  /* ---------- Navegação simples ---------- */
  var views = ["view-home","view-study","view-dialogue-pick","view-dialogue-play","view-history"];
  function showView(id){
    views.forEach(function(v){
      document.getElementById(v).classList.toggle("hidden", v!==id);
    });
  }

  /* ---------- Progresso / desbloqueio de grupo ---------- */
  function phrasesOfGroup(g){
    return PHRASES.filter(function(p){ return p.group === g; });
  }
  function isGroupLearned(g){
    return phrasesOfGroup(g).every(function(p){
      return !!(state.srs[p.id] && state.srs[p.id].learned);
    });
  }
  function recomputeUnlockedGroup(){
    var g = 1;
    while(g < MAX_GROUP && isGroupLearned(g)){
      g++;
    }
    state.unlockedGroup = g;
    saveState();
  }

  /* ---------- Fila de estudo ---------- */
  function buildQueue(){
    var today = todayStr();
    return PHRASES.filter(function(p){ return p.group <= state.unlockedGroup; })
      .filter(function(p){
        var s = state.srs[p.id];
        if(!s) return true;
        return s.nextReview <= today;
      })
      .map(function(p){ return p.id; });
  }

  /* ---------- Renderização: HOME ---------- */
  function renderHome(){
    recomputeUnlockedGroup();
    var queue = buildQueue();
    var statusEl = document.getElementById("home-status");
    var subEl = document.getElementById("home-sub");
    var btnStudy = document.getElementById("btn-start-study");

    if(queue.length > 0){
      statusEl.textContent = queue.length === 1
        ? "Você tem 1 frase para revisar"
        : "Você tem " + queue.length + " frases para revisar";
      subEl.textContent = "";
      btnStudy.disabled = false;
      btnStudy.textContent = "Continuar estudo";
    } else {
      statusEl.textContent = "Tudo em dia por hoje";
      subEl.textContent = "Volte mais tarde ou pratique o diálogo.";
      btnStudy.disabled = false;
      btnStudy.textContent = "Revisar mesmo assim";
    }

    var list = document.getElementById("group-list");
    list.innerHTML = "";
    for(var g=1; g<=MAX_GROUP; g++){
      var li = document.createElement("li");
      var learnedCount = phrasesOfGroup(g).filter(function(p){
        return state.srs[p.id] && state.srs[p.id].learned;
      }).length;
      var total = phrasesOfGroup(g).length;
      var name = document.createElement("span");
      name.textContent = "Grupo " + g + " — " + GROUP_NAMES[g];
      var badge = document.createElement("span");
      badge.className = "badge";
      if(g > state.unlockedGroup){
        badge.textContent = "bloqueado";
        badge.classList.add("locked");
      } else if(learnedCount === total){
        badge.textContent = "completo";
        badge.classList.add("done");
      } else {
        badge.textContent = learnedCount + "/" + total;
      }
      li.appendChild(name);
      li.appendChild(badge);
      list.appendChild(li);
    }

    var dialogueBtn = document.getElementById("btn-start-dialogue");
    var hasDialogue = DIALOGUES.some(function(d){ return d.group <= state.unlockedGroup; });
    dialogueBtn.disabled = !hasDialogue;
  }

  /* ---------- Estudo ---------- */
  var studyQueue = [];
  var studyIndex = 0;
  var studyPhase = "recall"; // "recall" | "reveal"

  function startStudy(){
    studyQueue = buildQueue();
    studyIndex = 0;
    if(studyQueue.length === 0){
      showView("view-home");
      return;
    }
    showView("view-study");
    renderStudyCard(true);
  }

  function currentPhrase(){
    return PHRASES.find(function(p){ return p.id === studyQueue[studyIndex]; });
  }

  function renderStudyCard(autoSpeak){
    var p = currentPhrase();
    studyPhase = "recall";
    document.getElementById("study-progress").textContent =
      (studyIndex+1) + " de " + studyQueue.length;

    var card = document.getElementById("study-card");
    card.innerHTML = "";

    var label = document.createElement("div");
    label.className = "label";
    label.textContent = "Você lembra o significado?";
    card.appendChild(label);

    var hanzi = document.createElement("div");
    hanzi.className = "hanzi";
    hanzi.textContent = p.hanzi;
    card.appendChild(hanzi);

    var pinyin = document.createElement("div");
    pinyin.className = "pinyin";
    pinyin.textContent = p.pinyin;
    card.appendChild(pinyin);

    var audioBlock = buildAudioBlock("p" + p.id, p.hanzi, p.words);
    card.appendChild(audioBlock.wrap);

    var row2 = document.createElement("div");
    row2.className = "row";
    var btnNo = document.createElement("button");
    btnNo.className = "btn btn-bad";
    btnNo.textContent = "Não lembrei";
    btnNo.onclick = function(){ handleAssessment(p, false); };
    var btnYes = document.createElement("button");
    btnYes.className = "btn btn-good";
    btnYes.textContent = "Lembrei";
    btnYes.onclick = function(){ handleAssessment(p, true); };
    row2.appendChild(btnNo);
    row2.appendChild(btnYes);
    card.appendChild(row2);

    if(autoSpeak){
      hear("p" + p.id, p.hanzi, 1);
      audioBlock.refreshCounters();
    }
  }

  function handleAssessment(p, remembered){
    markResult(p.id, remembered);
    logActivity(p, remembered);
    renderRevealCard(p, remembered);
  }

  function logActivity(p, correct){
    var now = new Date();
    state.log.push({
      date: todayStr(),
      time: pad(now.getHours()) + ":" + pad(now.getMinutes()),
      phraseId: p.id,
      hanzi: p.hanzi,
      pt: p.pt,
      correct: correct
    });
    if(state.log.length > MAX_LOG_ENTRIES){
      state.log = state.log.slice(state.log.length - MAX_LOG_ENTRIES);
    }
    saveState();
  }

  function markResult(id, remembered){
    var s = getSRS(id);
    var today = todayStr();
    if(remembered){
      if(s.lastCorrectDate !== today){
        s.correctCount = Math.min(s.correctCount + 1, 3);
        s.lastCorrectDate = today;
        if(s.correctCount >= 3){
          s.learned = true;
        }
      }
      var idx = Math.min(s.correctCount - 1, INTERVALS.length - 1);
      var days = idx >= 0 ? INTERVALS[idx] : 1;
      s.nextReview = addDays(today, days);
    } else {
      s.correctCount = 0;
      s.learned = false;
      s.nextReview = today;
    }
    saveState();
  }

  function renderRevealCard(p, remembered){
    studyPhase = "reveal";
    var card = document.getElementById("study-card");
    card.innerHTML = "";

    var label = document.createElement("div");
    label.className = "label";
    label.textContent = remembered ? "Você acertou" : "Vamos revisar";
    card.appendChild(label);

    var hanzi = document.createElement("div");
    hanzi.className = "hanzi";
    hanzi.textContent = p.hanzi;
    card.appendChild(hanzi);

    var pinyin = document.createElement("div");
    pinyin.className = "pinyin";
    pinyin.textContent = p.pinyin;
    card.appendChild(pinyin);

    var translation = document.createElement("div");
    translation.className = "translation";
    translation.textContent = p.pt;
    card.appendChild(translation);

    var mainAudio = buildAudioBlock("p" + p.id, p.hanzi, p.words);
    card.appendChild(mainAudio.wrap);

    if(p.responses && p.responses.length){
      p.responses.forEach(function(r, idx){
        var block = document.createElement("div");
        block.className = "response-block";

        var respLabel = document.createElement("div");
        respLabel.className = "label";
        respLabel.textContent = "Resposta possível";
        block.appendChild(respLabel);

        var rh = document.createElement("div");
        rh.className = "hanzi";
        rh.textContent = r.hanzi;
        block.appendChild(rh);

        var rp = document.createElement("div");
        rp.className = "pinyin";
        rp.textContent = r.pinyin;
        block.appendChild(rp);

        var rt = document.createElement("div");
        rt.className = "translation";
        rt.textContent = r.pt;
        block.appendChild(rt);

        var rAudio = buildAudioBlock("p" + p.id + "-r" + idx, r.hanzi, r.words);
        block.appendChild(rAudio.wrap);

        card.appendChild(block);
      });
    }

    var next = document.createElement("button");
    next.className = "btn btn-primary";
    next.textContent = (studyIndex + 1 < studyQueue.length) ? "Próxima" : "Finalizar sessão";
    next.onclick = function(){
      studyIndex++;
      if(studyIndex >= studyQueue.length){
        recomputeUnlockedGroup();
        showView("view-home");
        renderHome();
      } else {
        renderStudyCard(true);
      }
    };
    card.appendChild(next);
  }

  /* ---------- Diálogo ---------- */
  function renderDialoguePicker(){
    var list = document.getElementById("dialogue-list");
    list.innerHTML = "";
    DIALOGUES.forEach(function(d, idx){
      var btn = document.createElement("button");
      btn.className = "dialogue-choice";
      var available = d.group <= state.unlockedGroup;
      btn.disabled = !available;
      btn.innerHTML = "<strong>" + d.title + "</strong><br><span class='muted'>Grupo " + d.group + (available ? "" : " — bloqueado") + "</span>";
      btn.onclick = function(){ startDialogue(idx); };
      list.appendChild(btn);
    });
    showView("view-dialogue-pick");
  }

  var dialogueIds = [];
  var dialogueIndex = 0;
  var dialogueStopped = false;

  function startDialogue(idx){
    dialogueIds = DIALOGUES[idx].ids;
    dialogueIndex = 0;
    dialogueStopped = false;
    showView("view-dialogue-play");
    playDialogueStep();
  }

  function playDialogueStep(){
    if(dialogueStopped) return;
    if(dialogueIndex >= dialogueIds.length){
      var card = document.getElementById("dialogue-card");
      card.innerHTML = "";
      var done = document.createElement("div");
      done.className = "translation";
      done.textContent = "Fim do diálogo";
      card.appendChild(done);
      var back = document.createElement("button");
      back.className = "btn btn-primary";
      back.textContent = "Voltar ao início";
      back.onclick = function(){ showView("view-home"); renderHome(); };
      card.appendChild(back);
      document.getElementById("dialogue-progress").textContent = "";
      return;
    }
    var p = PHRASES.find(function(x){ return x.id === dialogueIds[dialogueIndex]; });
    document.getElementById("dialogue-progress").textContent =
      (dialogueIndex+1) + " de " + dialogueIds.length;

    var card = document.getElementById("dialogue-card");
    card.innerHTML = "";
    var hanzi = document.createElement("div");
    hanzi.className = "hanzi";
    hanzi.textContent = p.hanzi;
    card.appendChild(hanzi);
    var pinyin = document.createElement("div");
    pinyin.className = "pinyin";
    pinyin.textContent = p.pinyin;
    card.appendChild(pinyin);
    var translation = document.createElement("div");
    translation.className = "translation";
    translation.textContent = p.pt;
    card.appendChild(translation);

    renderWordChips(card, p.words);

    hear("p" + p.id, p.hanzi, 1, function(){
      if(dialogueStopped) return;
      setTimeout(function(){
        dialogueIndex++;
        playDialogueStep();
      }, 1400);
    });
  }

  /* ---------- Histórico ---------- */
  function formatDateLabel(dateStr){
    var today = todayStr();
    var yesterday = addDays(today, -1);
    if(dateStr === today) return "Hoje";
    if(dateStr === yesterday) return "Ontem";
    var parts = dateStr.split("-").map(Number);
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    try{
      return d.toLocaleDateString("pt-BR", {day:"2-digit", month:"long", year:"numeric"});
    }catch(e){
      return dateStr;
    }
  }

  function renderHistory(){
    var listEl = document.getElementById("history-list");
    var summaryEl = document.getElementById("history-summary");
    listEl.innerHTML = "";

    var log = state.log;
    if(log.length === 0){
      summaryEl.textContent = "Nenhuma atividade registrada ainda.";
      var empty = document.createElement("div");
      empty.className = "card center muted";
      empty.textContent = "Comece uma sessão de estudo para começar seu histórico.";
      listEl.appendChild(empty);
      return;
    }

    var totalCorrect = log.filter(function(e){ return e.correct; }).length;
    summaryEl.textContent = log.length + " revisões · " + totalCorrect + " acertos";

    var byDate = {};
    log.forEach(function(entry){
      if(!byDate[entry.date]) byDate[entry.date] = [];
      byDate[entry.date].push(entry);
    });
    var dates = Object.keys(byDate).sort().reverse();

    dates.forEach(function(date){
      var entries = byDate[date];
      var correctCount = entries.filter(function(e){ return e.correct; }).length;

      var dayCard = document.createElement("div");
      dayCard.className = "card history-day";

      var title = document.createElement("div");
      title.className = "history-day-title";
      title.textContent = formatDateLabel(date) + " — " + correctCount + "/" + entries.length + " acertos";
      dayCard.appendChild(title);

      entries.forEach(function(entry){
        var row = document.createElement("div");
        row.className = "history-entry";

        var time = document.createElement("div");
        time.className = "history-time";
        time.textContent = entry.time;

        var text = document.createElement("div");
        text.className = "history-text";
        var hz = document.createElement("div");
        hz.className = "hz";
        hz.textContent = entry.hanzi;
        var tr = document.createElement("div");
        tr.className = "tr";
        tr.textContent = entry.pt;
        text.appendChild(hz);
        text.appendChild(tr);

        var mark = document.createElement("div");
        mark.className = "history-mark " + (entry.correct ? "ok" : "no");
        mark.textContent = entry.correct ? "✓" : "✗";

        row.appendChild(time);
        row.appendChild(text);
        row.appendChild(mark);
        dayCard.appendChild(row);
      });

      listEl.appendChild(dayCard);
    });
  }

  /* ---------- Eventos ---------- */
  document.getElementById("btn-start-study").onclick = startStudy;
  document.getElementById("btn-start-dialogue").onclick = renderDialoguePicker;
  document.getElementById("btn-start-history").onclick = function(){
    renderHistory();
    showView("view-history");
  };
  document.getElementById("btn-history-back").onclick = function(){
    showView("view-home");
    renderHome();
  };
  document.getElementById("btn-study-back").onclick = function(){
    speechSynthesis.cancel();
    showView("view-home");
    renderHome();
  };
  document.getElementById("btn-dialogue-back").onclick = function(){
    showView("view-home");
  };
  document.getElementById("btn-dialogue-stop").onclick = function(){
    dialogueStopped = true;
    speechSynthesis.cancel();
    showView("view-home");
    renderHome();
  };
  document.getElementById("btn-reset").onclick = function(){
    if(confirm("Apagar todo o progresso salvo?")){
      localStorage.removeItem(STORAGE_KEY);
      state = defaultState();
      renderHome();
    }
  };

  /* ---------- Início ---------- */
  renderHome();

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("service-worker.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
