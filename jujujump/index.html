<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Juju Jump</title>
<meta name="description" content="Julia's world of games: English and Chinese through play.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#5b3df5">
<meta name="mobile-web-app-capable" content="yes">
<style>
@font-face{font-family:"Arcade";src:url(fonts/pressstart.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Baloo";src:url(fonts/baloo700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Baloo";src:url(fonts/baloo800.woff2) format("woff2");font-weight:800;font-display:swap}
:root{--pink:#ff4fa0;--pinkd:#c41d6e;--vio:#6b4cff;--viod:#4127c4;--sun:#ffd23f;--sund:#d99a00;--mint:#2fd6a3;--mintd:#16a076;
  --sky:#46b4ff;--skyd:#1a7fcc;--ora:#ff8a3d;--orad:#cc5b12;--ink:#3b1550;--paper:#fff8fc;--BAR:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#5b3df5;color:#fff;font-family:"Baloo",system-ui,sans-serif;font-weight:700}
button{font-family:inherit;font-weight:800;border:0;cursor:pointer;color:inherit;background:none;padding:0}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;overflow:hidden;
  padding:env(safe-area-inset-top) 0 calc(var(--BAR) + env(safe-area-inset-bottom));background:linear-gradient(180deg,#7b5cff 0%,#5b3df5 45%,#ff6fb5 100%)}
.screen.on{display:flex}
#wipe{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;font-size:90px;pointer-events:all}
#wipe span{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#fx{position:fixed;inset:0;z-index:80;pointer-events:none}
.bar{position:relative;z-index:6;width:100%;display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.ibtn{min-width:50px;height:50px;border-radius:16px;font-size:24px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(40,10,80,.3);padding:0 8px}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(40,10,80,.3)}
.ttl{flex:1;text-align:center;font-family:"Arcade";font-size:12px;line-height:1.5;text-shadow:2px 2px 0 rgba(40,10,80,.5)}
.bcount{background:rgba(255,255,255,.22);border-radius:14px;padding:6px 10px;font-size:18px;white-space:nowrap}
.stage{position:relative;flex:1;width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;z-index:2;overflow:hidden}

/* generic pieces */
.bubble{position:fixed;z-index:70;width:220px;background:#fff;color:var(--ink);border-radius:18px;padding:10px 12px;font-size:18px;text-align:center;box-shadow:0 6px 18px rgba(40,10,80,.3);animation:bIn .35s cubic-bezier(.3,1.7,.5,1)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble.out{opacity:0;transform:scale(.6);transition:.35s}
@keyframes bIn{from{transform:scale(.3);opacity:0}}
.floaty{position:fixed;z-index:75;pointer-events:none;font-family:"Arcade";font-size:18px;color:#fff;text-shadow:2px 2px 0 var(--pinkd);animation:fly 1.1s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes fly{to{margin-top:-90px;opacity:0;scale:1.5}}
.flybamboo{position:fixed;z-index:76;font-size:34px;pointer-events:none;margin:-17px 0 0 -17px}
.faceflyer{position:fixed;left:0;top:0;z-index:77;width:140px;height:140px;pointer-events:none}
.faceflyer img{width:100%;height:100%;border-radius:50%;border:5px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.faceflyer span{position:absolute;left:30px;top:-46px;font-size:70px}
.wobble{animation:wob .5s}
@keyframes wob{20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
.jelly{animation:jel .5s}
@keyframes jel{30%{transform:scale(1.25,.8)}50%{transform:scale(.85,1.2)}70%{transform:scale(1.08,.95)}}
.t1{color:#ff3b3b}.t2{color:#ff9a1f}.t3{color:#21b35a}.t4{color:#2f7dff}.t5{color:#888}
.wcard{background:#fff;color:var(--ink);border-radius:22px;padding:10px 14px;text-align:center;box-shadow:0 6px 0 rgba(40,10,80,.25);min-width:150px;animation:bIn .4s cubic-bezier(.3,1.7,.5,1)}
.wcard .we{font-size:56px;line-height:1.1}.wcard .wen{font-size:24px}.wcard .wzh{font-size:34px;line-height:1.1;color:var(--pinkd)}.wcard .wpy{font-size:20px}
.wcard.big .we{font-size:84px}.wcard.big .wen{font-size:30px}.wcard.big .wzh{font-size:46px}.wcard.big .wpy{font-size:26px}
.say{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:#ffe3f2;font-size:24px;margin-top:6px}
.prompt{font-size:min(6vw,26px);text-align:center;padding:6px 14px;margin:4px 10px;background:rgba(40,10,80,.42);border-radius:18px;text-shadow:0 2px 0 rgba(40,10,80,.45);min-height:2.3em;line-height:1.15}
.prompt b{color:var(--sun)}
.bigbtn{font-size:24px;padding:14px 22px;border-radius:20px;background:var(--sun);color:#5a3a00;box-shadow:0 6px 0 var(--sund)}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sund)}
.dots{display:flex;gap:6px;justify-content:center;margin:2px 0}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.35)} .dots i.on{background:var(--sun)}

/* splash */
#splash{justify-content:center;gap:22px;text-align:center}
.logo{font-family:"Arcade";line-height:1.2;z-index:3}
.logo .a{display:block;font-size:min(15vw,64px);color:#fff;text-shadow:4px 4px 0 var(--pinkd),8px 8px 0 rgba(40,10,80,.35)}
.logo .b{display:block;font-size:min(15vw,64px);color:var(--sun);text-shadow:4px 4px 0 var(--viod),8px 8px 0 rgba(40,10,80,.35)}
.logo .zh{display:block;font-family:"Baloo",sans-serif;font-size:22px;margin-top:10px;text-shadow:0 2px 0 rgba(40,10,80,.4)}
.logo .ch{display:inline-block}
.press{font-family:"Arcade";font-size:15px;background:#fff;color:var(--pink);padding:18px 22px;border-radius:16px;box-shadow:0 6px 0 var(--pinkd);animation:blink 1s steps(2) infinite;z-index:3}
@keyframes blink{50%{opacity:.3}}
.clouds{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.clouds i{position:absolute;font-style:normal;font-size:70px;opacity:.75;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
#introFace{position:absolute;width:110px;height:110px;z-index:4;pointer-events:none;display:none}
#introFace img{width:100%;height:100%;border-radius:50%;border:5px solid #fff;box-shadow:0 8px 0 rgba(40,10,80,.3)}

/* map */
#map{background:linear-gradient(180deg,#6fd0ff 0%,#9ee3ff 40%,#ffd1ec 100%)}
#map .bar{background:linear-gradient(180deg,rgba(91,61,245,.95),rgba(91,61,245,.75));box-shadow:0 4px 12px rgba(40,10,80,.25)}
#map .ttl{font-size:16px;color:var(--sun)}
#world{position:relative;flex:1;width:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#worldIn{position:relative;width:100%;max-width:520px;margin:0 auto}
#path{position:absolute;inset:0;pointer-events:none}
.isl{position:absolute;width:118px;height:118px;margin:-59px 0 0 -59px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:15px;line-height:1.05;text-align:center;color:#fff;box-shadow:0 8px 0 rgba(40,10,80,.25),inset 0 -8px 0 rgba(0,0,0,.12);animation:bob 3s ease-in-out infinite}
.isl .em{font-size:48px;line-height:1.05}
.isl small{display:block;font-size:12px;opacity:.95;max-width:100px;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.isl .stars{position:absolute;bottom:-14px;font-size:14px;letter-spacing:1px}
.isl:active{transform:scale(.93)}
@keyframes bob{50%{translate:0 -6px}}
#avatar{position:absolute;width:74px;height:74px;margin:-110px 0 0 -37px;z-index:5;transition:none}
#wotd{position:fixed;left:50%;bottom:calc(var(--BAR) + 14px);transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:8px;background:#fff;color:#3b1550;border-radius:22px;padding:8px 14px;box-shadow:0 8px 20px rgba(40,10,80,.3);animation:bIn .5s cubic-bezier(.3,1.7,.5,1);max-width:94vw}
#wotd .panda{width:70px;height:70px} #wotd .we{font-size:40px} #wotd small{display:block;font-size:12px;color:#8a6bb0}
#avatar img{width:100%;height:100%;border-radius:50%;border:4px solid #fff;box-shadow:0 6px 0 rgba(40,10,80,.3)}
#avatar::after{content:"";position:absolute;left:12px;right:12px;bottom:-18px;height:10px;border-radius:50%;background:rgba(40,10,80,.25)}
.cloudbg{position:absolute;font-size:80px;opacity:.85;pointer-events:none}

/* panda */
.panda{position:relative;width:200px;height:200px}
.panda svg{width:100%;height:100%;overflow:visible}
.panda .phead{transform-origin:100px 90px;animation:ptilt 4s ease-in-out infinite}
@keyframes ptilt{50%{transform:rotate(4deg)}}
.panda .peyes{transform-origin:100px 78px;animation:pblink 4.5s infinite}
@keyframes pblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.panda .parm{transform-origin:50px 110px} .panda .parm.r{transform-origin:150px 110px}
.panda.wave .parm.r{animation:pwave .5s 3 ease-in-out}
@keyframes pwave{50%{transform:rotate(-60deg)}}
.panda.talk .pmouth{animation:ptalk .25s infinite alternate}
@keyframes ptalk{to{d:path("M88 106 Q100 128 112 106")}}
.panda.happy{animation:jel .6s}
.panda .phat{position:absolute;left:50%;top:-26px;transform:translateX(-50%);font-size:64px;line-height:1;pointer-events:none}

/* overlay / options */
.ov{position:fixed;inset:0;z-index:85;display:none;align-items:center;justify-content:center;background:rgba(30,10,60,.6);padding-bottom:var(--BAR)}
.ov.on{display:flex}
.obox{background:#fff;color:var(--ink);border-radius:26px;padding:16px;width:min(92vw,420px);max-height:calc(94vh - var(--BAR));overflow:auto;display:flex;flex-direction:column;gap:10px;text-align:center;animation:bIn .4s cubic-bezier(.3,1.7,.5,1)}
.obox h3{font-family:"Arcade";font-size:15px;margin:4px 0;color:var(--vio)}
.orow{font-size:20px;padding:12px;border-radius:16px;background:#f1eaff;color:var(--ink);box-shadow:0 4px 0 #d6c8f5}
.orow.danger{background:#ffe1e1;color:#b3122a;box-shadow:0 4px 0 #f0b0b0}
.obtns{display:flex;gap:10px}.obtns button{flex:1;font-size:20px;padding:12px;border-radius:16px;color:#fff}
.small{font-size:15px;color:#6b5a7a;line-height:1.3}
.wordlist{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.wordlist div{background:#f7f2ff;border-radius:12px;padding:4px;font-size:13px;line-height:1.15}
.wordlist div b{display:block;font-size:22px}

/* game-specific styles live next to each game (added from JS) */
</style>
</head>
<body>

<section id="splash" class="screen on">
  <div class="clouds"><i style="top:8%;animation-duration:38s">☁️</i><i style="top:30%;animation-duration:52s;animation-delay:-20s">☁️</i><i style="top:62%;animation-duration:44s;animation-delay:-8s">☁️</i></div>
  <div id="introFace"><img alt=""></div>
  <div class="logo" id="logo"><span class="a">JUJU</span><span class="b">JUMP</span><span class="zh">朱莉娅的乐园 · Zhū lì yà de lè yuán</span></div>
  <div id="splashPanda"></div>
  <button class="press" id="press">TAP TO JUMP!</button>
</section>

<section id="map" class="screen">
  <div class="bar">
    <button class="ibtn" id="gear">⚙️</button>
    <div class="ttl">JUJU JUMP</div>
    <div class="bcount" id="mapBamboo">🎋 0</div>
    <button class="ibtn" id="goPanda" style="font-size:30px">🐼</button>
  </div>
  <div id="world"><div id="worldIn"><svg id="path"></svg><div id="avatar"><img alt=""></div></div></div>
</section>

<section id="game" class="screen">
  <div class="bar"><button class="ibtn" id="back">🗺️</button><div class="ttl" id="gttl"></div><div class="bcount">🎋 0</div></div>
  <div class="stage" id="stage"></div>
</section>

<div class="ov" id="opts"><div class="obox" id="obox"></div></div>
<div id="wipe"><span>⭐</span></div>
<canvas id="fx"></canvas>

<script src="js/core.js"></script>
<script src="js/words.js"></script>
<script src="js/games1.js"></script>
<script src="js/games2.js"></script>
<script src="js/hub.js"></script>
</body>
</html>
